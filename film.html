      }

      /* ------------------------------------------------------------------------
         SCENE 6 (23.8s – 32.8s): COMING HOME & THE SISTER HUG
         - 23.8s – 29.4s (lt: 0.0 – 5.6s): Cold twilight-blue bedroom. 12yo curls
           up crying alone on her bed with animated glistening teardrops, while
           her cool-blue insulin pump pulses steadily on the nightstand.
         - 29.4s – 32.8s (lt: 5.6 – 9.0s): NO CAPTIONS. Bedroom door slowly opens
           casting a warm golden wedge of hallway light across the cold blue room;
           19yo sits beside her on the bed, and the 12yo leans in and hugs her
           older sister tightly in a tender, protective embrace.
         ------------------------------------------------------------------------ */
      function renderScene6(c, t) {
        const lt = t - 23.8; // 0..9.0s

        // PART A (23.8s – 29.4s): Curled up crying alone in cold twilight-blue bedroom
        if (lt < 5.6) {
          const duskProgress = smoothstep(lt / 5.6);
          const pushIn = lerp(1.0, 1.18, easeInOutSine(lt / 5.6));

          const bg = c.createLinearGradient(0, 0, 0, LOGICAL_H);
          bg.addColorStop(0, "#070b17");
          bg.addColorStop(1, "#121a30");
          c.fillStyle = bg;
          c.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

          c.save();
          c.translate(LOGICAL_W * 0.54, LOGICAL_H * 0.52);
          c.scale(pushIn, pushIn);
          c.translate(-LOGICAL_W * 0.54, -LOGICAL_H * 0.52);

          // Cold twilight blind slats
          c.fillStyle = `rgba(115, 155, 228, ${lerp(0.11, 0.06, duskProgress)})`;
          for (let i = 0; i < 5; i++) {
            c.beginPath();
            c.moveTo(140, 62 + i * 52);
            c.lineTo(735, 158 + i * 52);
            c.lineTo(735, 175 + i * 52);
            c.lineTo(140, 79 + i * 52);
            c.closePath();
            c.fill();
          }

          // Bed headboard & pillow
          c.fillStyle = "#111626";
          drawRoundedRect(c, 368, 158, 776, 428, 18);
          c.fill();

          c.fillStyle = "#2b3754";
          drawRoundedRect(c, 510, 236, 266, 158, 58);
          c.fill();

          // Damp tear stain spreading softly on pillow
          const stainAlpha = smoothstep(invLerp(0.8, 4.5, lt)) * 0.35;
          if (stainAlpha > 0.01) {
            c.fillStyle = `rgba(14, 22, 42, ${stainAlpha})`;
            c.beginPath();
            c.ellipse(680, 354, 23, 11, 0.12, 0, Math.PI * 2);
            c.ellipse(658, 362, 13, 6, -0.1, 0, Math.PI * 2);
            c.fill();
          }

          const sobCycle = (lt * 0.85) % 1.0;
          const sobHitch = Math.sin(sobCycle * Math.PI * 2) * Math.exp(-sobCycle * 3.5) * 3.8;
          const microTremble = Math.sin(lt * 16) * 0.65 * smoothstep(invLerp(0.4, 1.5, lt));

          // Curled-up blanket mound
          c.save();
          c.translate(0, sobHitch + microTremble);
          c.fillStyle = "#23304f";
          c.beginPath();
          c.moveTo(652, 320);
          c.bezierCurveTo(770, 232, 985, 250, 1088, 370);
          c.lineTo(1104, 570);
          c.lineTo(536, 570);
          c.quadraticCurveTo(560, 402, 652, 320);
          c.closePath();

      /* ------------------------------------------------------------------------
         SCENE 7 (32.8s – 40.0s): STARK CLOSING EDITORIAL CARDS (FULL 16:9)
         Always visible even if bottom subtitles are toggled:
         - 33.0s – 35.6s: "Nine and a half million people live like this."
         - 35.8s – 37.8s: "How many are cured right now?"
         - 37.8s – 38.6s: [complete silent dark beat]
         - 38.6s – 40.0s: "None." (stark pure white text, holding cleanly at 40.0s)
         ------------------------------------------------------------------------ */
      function renderScene7(c, t) {
        const lt = t - 32.8; // 0..7.2s

        // Deep charcoal/obsidian screen
        const bg = c.createRadialGradient(
          FRAME_W * 0.5, FRAME_H * 0.48, 36,
          FRAME_W * 0.5, FRAME_H * 0.5, FRAME_W * 0.62
        );
        bg.addColorStop(0, "#0b0d14");
        bg.addColorStop(1, "#030407");
        c.fillStyle = bg;
        c.fillRect(0, 0, FRAME_W, FRAME_H);

        // Subtle atmospheric dust motes fading gently into stillness
        const dustFade = 1 - smoothstep(invLerp(4.4, 5.6, lt)) * 0.7;
        c.save();
        for (const m of dustMotes) {
          const mx = ((m.x + t * m.vx * 0.4) % FRAME_W + FRAME_W) % FRAME_W;
          const my = ((m.y * (FRAME_H / LOGICAL_H) + t * m.vy * 0.4) % FRAME_H + FRAME_H) % FRAME_H;
          const a = m.alpha * 0.30 * dustFade * (0.65 + 0.35 * Math.sin(t * 1.1 + m.phase));
          c.fillStyle = `rgba(182, 208, 246, ${a.toFixed(3)})`;
          c.beginPath();
          c.arc(mx, my, m.r, 0, Math.PI * 2);
          c.fill();
        }
        c.restore();

        // Thin, subtle fading pulse/flat line across the center before "None."
        const lineAlpha = smoothstep(invLerp(0.0, 0.55, lt)) * (1 - smoothstep(invLerp(4.8, 5.6, lt)));
        if (lineAlpha > 0.01) {
          c.save();
          const lineY = FRAME_H * 0.61;
          const ampDecay = 1 - smoothstep(invLerp(2.4, 4.9, lt));
          c.strokeStyle = `rgba(128, 172, 236, ${(0.34 * lineAlpha).toFixed(3)})`;
          c.lineWidth = 1.8;
          c.beginPath();
          for (let x = 240; x <= FRAME_W - 240; x += 3) {
            const norm = (x - 240) / (FRAME_W - 480);
            const edgeFade = Math.sin(norm * Math.PI);
            const phase = ((norm * 2.5 - lt * 0.36) % 1 + 1) % 1;
            let dy = 0;
            if (phase > 0.44 && phase < 0.48) dy = -24 * ampDecay;
            else if (phase >= 0.48 && phase < 0.51) dy = 9 * ampDecay;
            else if (phase >= 0.55 && phase < 0.62) dy = -5 * ampDecay * Math.sin(((phase - 0.55) / 0.07) * Math.PI);
            const py = lineY + dy * edgeFade;
            if (x === 240) c.moveTo(x, py);
            else c.lineTo(x, py);
          }
          c.stroke();
          c.restore();
        }

        // Centered Editorial Typography
        c.save();
        c.textAlign = "center";
        c.textBaseline = "middle";

        // 33.0s – 35.6s
        if (t >= 33.0 && t <= 35.6) {
          const a = smoothstep(invLerp(33.0, 33.42, t)) * (1 - smoothstep(invLerp(35.2, 35.6, t)));
          c.globalAlpha = a;
          c.fillStyle = "#eef2fa";
          c.font = "400 44px Georgia, 'Palatino Linotype', serif";
          c.fillText("Nine and a half million people live like this.", FRAME_W * 0.5, FRAME_H * 0.47);
        }

        // 35.8s – 37.8s
        if (t >= 35.8 && t <= 37.8) {
          const a = smoothstep(invLerp(35.8, 36.18, t)) * (1 - smoothstep(invLerp(37.42, 37.8, t)));
          c.globalAlpha = a;
          c.fillStyle = "#eef2fa";
          c.font = "400 46px Georgia, 'Palatino Linotype', serif";
          c.fillText("How many are cured right now?", FRAME_W * 0.5, FRAME_H * 0.47);
        }

        // 37.8s – 38.6s: complete silent dark beat

        // 38.6s – 40.0s: Stark pure white "None." holding cleanly at 40.0s
        if (t >= 38.6) {
          const a = smoothstep(invLerp(38.6, 38.92, t));
          c.globalAlpha = a;
          c.fillStyle = "#ffffff";
          c.font = "700 88px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
          c.shadowColor = "rgba(255, 255, 255, 0.16)";
          c.shadowBlur = 24;
          c.fillText("None.", FRAME_W * 0.5, FRAME_H * 0.47);
          c.shadowBlur = 0;
        }

        c.restore();
      }

      /* ========================================================================
         6. MAIN FRAME DISPATCHER & 16:9 LETTERBOX COMPOSITION
         ======================================================================== */
      function renderFilmFrame(t) {
        ctx.save();
        const scaleX = canvas.width / FRAME_W;
        const scaleY = canvas.height / FRAME_H;
        ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);

        // Cinema black background & letterbox bars
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, FRAME_W, FRAME_H);

        if (t >= 32.8) {
          // Scene 7 occupies the full 16:9 dark editorial screen
          renderScene7(ctx, t);
        } else {
          // Scenes 1–6 render in crisp 2.35:1 cinema letterbox framing inside 16:9
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, LETTERBOX_Y, LOGICAL_W, LOGICAL_H);
          ctx.clip();
          ctx.translate(0, LETTERBOX_Y);

          if (t < 10.5) {
            renderScene1(ctx, t);
          } else if (t < 15.0) {
            renderScene2(ctx, t);
          } else if (t < 17.8) {
            renderScene3(ctx, t);
          } else if (t < 21.0) {
            renderScene4(ctx, t);
          } else if (t < 23.8) {
            renderScene5(ctx, t);
          } else {
            renderScene6(ctx, t);
          }

          // Subtle scene cut polish on hard cuts
          const cuts = [15.0, 17.8, 23.8];
          for (const cutT of cuts) {
            const dist = Math.abs(t - cutT);
            if (dist < 0.12) {
              const a = (1 - dist / 0.12) * 0.46;
              ctx.fillStyle = `rgba(0,0,0,${a.toFixed(3)})`;
              ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
            }
          }

          // Global subtle cinema lens vignette
          drawVignette(ctx, 0.30);

          // Subtle animated indie film grain overlay
          grainFrame++;
          if (grainFrame % 3 === 0) updateGrain();
          ctx.globalAlpha = 0.50;
          ctx.drawImage(grainCanvas, 0, 0, LOGICAL_W, LOGICAL_H);
          ctx.globalAlpha = 1;

          ctx.restore();
        }

        ctx.restore();
      }

      function getSceneForTime(t) {
        for (let i = SCENES.length - 1; i >= 0; i--) {
          if (t >= SCENES[i].start) return SCENES[i];
        }
        return SCENES[0];

      // Crisp HiDPI responsive canvas sizing
      function resizeCanvas() {
        const rect = frameContainer.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(2, Math.floor(rect.width * dpr));
        canvas.height = Math.max(2, Math.floor(rect.height * dpr));
        renderFilmFrame(state.started ? state.time : 0.65);
      }

      function updateUI() {
        const pct = clamp((state.time / FILM_DURATION) * 100, 0, 100);
        scrubberFill.style.width = `${pct}%`;
        scrubberThumb.style.left = `${pct}%`;
        scrubberArea.setAttribute("aria-valuenow", Math.floor(state.time));
        timeReadout.textContent = `${formatTime(state.time)} / ${formatTime(FILM_DURATION)}`;

        const currentScene = getSceneForTime(state.time);
        sceneLabel.textContent = currentScene.label;

        iconPlay.style.display = state.playing ? "none" : "block";
        iconPause.style.display = state.playing ? "block" : "none";

        // Update bottom verbatim captions (Scenes 1–6 only; Scene 7 cards are always visible on canvas)
        if (!state.captionsOn || !state.started || state.ended || state.time >= 32.8) {
          captionText.classList.remove("visible");
        } else {
          const activeCap = CAPTIONS.find((c) => state.time >= c.start && state.time <= c.end);
          if (activeCap) {
            if (captionText.textContent !== activeCap.text) {
              captionText.textContent = activeCap.text;
            }
            captionText.classList.add("visible");
          } else {
            captionText.classList.remove("visible");
          }
        }
      }

      function showControlsTemporarily() {
        if (!state.started) return;
        controlsWrapper.classList.remove("idle-hidden");
        clearTimeout(state.idleTimer);
        if (state.playing && !state.dragging) {
          state.idleTimer = setTimeout(() => {
            if (state.playing && !state.dragging) {
              controlsWrapper.classList.add("idle-hidden");
            }
          }, 2400);
        }
      }

      function startFilm(fromZero = false) {
        audio.init();
        if (fromZero) {
          state.time = 0;
          audio.resetCuesForTime(0);
        }
        state.started = true;
        state.ended = false;
        state.playing = true;
        state.lastTimestamp = performance.now();
        titleOverlay.classList.add("hidden");
        endOverlay.classList.add("hidden");
        updateUI();
        showControlsTemporarily();
      }

      function togglePlayPause() {
        if (!state.started || state.ended) {
          startFilm(true);
          return;
        }
        audio.init();
        state.playing = !state.playing;
        state.lastTimestamp = performance.now();
        if (!state.playing) {
          audio.silenceContinuous();
          controlsWrapper.classList.remove("idle-hidden");
          clearTimeout(state.idleTimer);
        } else {
          showControlsTemporarily();
        }
        updateUI();
      }

      function seekTo(newTime) {
        state.time = clamp(newTime, 0, FILM_DURATION);
        state.ended = state.time >= FILM_DURATION;
        if (state.ended) {
          state.playing = false;
          audio.silenceContinuous();
          endOverlay.classList.remove("hidden");
        } else {
          endOverlay.classList.add("hidden");
        }
        audio.resetCuesForTime(state.time);
        renderFilmFrame(state.time);
        updateUI();
      }

      function toggleCaptions() {
        state.captionsOn = !state.captionsOn;
        btnCaptions.classList.toggle("active", state.captionsOn);
        updateUI();
      }

      function toggleMute() {
        state.muted = !state.muted;
        audio.setMuted(state.muted);
        iconVolOn.style.display = state.muted ? "none" : "block";
        iconVolOff.style.display = state.muted ? "block" : "none";
      }

      // 60fps Main Animation Loop
      function tick(now) {
        if (state.playing && !state.dragging) {
          const dt = Math.min(0.1, (now - state.lastTimestamp) / 1000);
          state.lastTimestamp = now;
          state.time += dt;

          if (state.time >= FILM_DURATION) {
            state.time = FILM_DURATION;
            state.playing = false;
            state.ended = true;
            audio.silenceContinuous();
            endOverlay.classList.remove("hidden");
            controlsWrapper.classList.remove("idle-hidden");
          }

          audio.update(state.time, state.playing);
          renderFilmFrame(state.time);
          updateUI();
        } else if (!state.started) {
          // Living ambient frame behind the opening title screen
          renderFilmFrame(0.65);
        }
        requestAnimationFrame(tick);
      }

      /* ========================================================================
         8. EVENT LISTENERS (CLICK, TOUCH, SCRUBBER & KEYBOARD SHORTCUTS)
         ======================================================================== */
      btnPlayStart.addEventListener("click", (e) => {
        e.stopPropagation();
        startFilm(true);
      });

      btnWatchAgain.addEventListener("click", (e) => {
        e.stopPropagation();
        startFilm(true);
      });

      btnPlayPause.addEventListener("click", (e) => {
        e.stopPropagation();
        togglePlayPause();
      });

      btnRestart.addEventListener("click", (e) => {
        e.stopPropagation();
        startFilm(true);
      });

      btnCaptions.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleCaptions();
      });

      btnMute.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMute();
      });

      // Clicking canvas toggles Play/Pause once started
      canvas.addEventListener("click", () => {
        if (state.started && !state.ended) {
          togglePlayPause();
        }
      });

      // Auto-reveal control bar on mouse or touch activity
      theater.addEventListener("mousemove", showControlsTemporarily);
      theater.addEventListener("touchstart", showControlsTemporarily, { passive: true });

      // Draggable Timeline Scrubber (Mouse + Touch via Pointer Events)
      function getScrubTimeFromEvent(e) {
        const rect = scrubberTrack.getBoundingClientRect();
        const frac = clamp((e.clientX - rect.left) / rect.width, 0, 1);
        return { frac, time: frac * FILM_DURATION };
      }

      scrubberArea.addEventListener("pointerdown", (e) => {
        if (!state.started) startFilm(false);
        state.dragging = true;
        scrubberArea.classList.add("dragging");
        try { scrubberArea.setPointerCapture(e.pointerId); } catch (_) {}
        const { time } = getScrubTimeFromEvent(e);
        seekTo(time);
      });

      scrubberArea.addEventListener("pointermove", (e) => {
        const { frac, time } = getScrubTimeFromEvent(e);
        const sc = getSceneForTime(time);
        scrubberTooltip.textContent = `${formatTime(time)} — ${sc.label}`;
        scrubberTooltip.style.left = `${clamp(frac * 100, 10, 90)}%`;
        scrubberTooltip.classList.add("show");
        if (state.dragging) {
          seekTo(time);
        }
      });

      scrubberArea.addEventListener("pointerup", (e) => {
        if (!state.dragging) return;
        state.dragging = false;
        scrubberArea.classList.remove("dragging");
        try { scrubberArea.releasePointerCapture(e.pointerId); } catch (_) {}
        state.lastTimestamp = performance.now();
        showControlsTemporarily();
      });

      scrubberArea.addEventListener("pointerleave", () => {
        if (!state.dragging) scrubberTooltip.classList.remove("show");
      });

      // Keyboard Shortcuts: Space, C, M, R, ArrowLeft, ArrowRight
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          togglePlayPause();
        } else if (e.key === "c" || e.key === "C") {
          toggleCaptions();
        } else if (e.key === "m" || e.key === "M") {
          toggleMute();
        } else if (e.key === "r" || e.key === "R") {
          startFilm(true);
        } else if (e.code === "ArrowRight" && state.started) {
          seekTo(state.time + 2.5);
        } else if (e.code === "ArrowLeft" && state.started) {
          seekTo(state.time - 2.5);
        }
      });

      window.addEventListener("resize", resizeCanvas);

      // Start rendering once page layout is loaded
      window.addEventListener("load", () => {
        resizeCanvas();
        updateUI();
        requestAnimationFrame(tick);
      });
    })();
  </script>
</body>
</html>
